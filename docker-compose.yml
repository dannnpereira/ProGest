# Sobe o projeto inteiro em uma maquina (EC2):
#   docker compose up -d --build
# Antes, copie .env.example para .env e defina DB_PASSWORD.

services:
  backend:
    build: ./backend/Backend_api
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
      # Administrador do ERP: criado/atualizado com esta senha a cada inicio
      ADMIN_EMAIL: ${ADMIN_EMAIL:-amaralalambrados109@gmail.com}
      ADMIN_NOME: ${ADMIN_NOME:-Administrador}
      ADMIN_SENHA: ${ADMIN_SENHA:?Defina ADMIN_SENHA no arquivo .env}
      # Funcionario do ERP (opcional): so ve Producao e Entregas
      FUNCIONARIO_EMAIL: ${FUNCIONARIO_EMAIL:-}
      FUNCIONARIO_NOME: ${FUNCIONARIO_NOME:-Funcionário}
      FUNCIONARIO_SENHA: ${FUNCIONARIO_SENHA:-}
      # Dados ficticios para apresentacao (opcional; roda uma vez so por banco)
      DEMO_DADOS: ${DEMO_DADOS:-false}
      DEMO_SENHA: ${DEMO_SENHA:-}
      # Limita a memoria do Java para caber em uma instancia pequena
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx512m
    volumes:
      - progest-data:/app/data
    # Sem "ports": o backend so e acessivel pelo Nginx

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  # Arquivo do banco H2. Sobrevive a rebuilds e reinicios.
  # NAO rode "docker compose down -v": o -v apaga o banco.
  progest-data:
