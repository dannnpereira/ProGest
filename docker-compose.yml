# Sobe o projeto inteiro em uma maquina (EC2). Antes, copie .env.example para .env
# e preencha as senhas e o DOCKERHUB_USUARIO.
#
# Normal: baixa as imagens prontas que a Action publica no Docker Hub a cada merge na main
#   docker compose pull && docker compose up -d
# Sem Docker Hub (ou para testar uma mudanca local): gera as imagens na propria maquina
#   docker compose up -d --build

services:
  backend:
    # VERSAO=latest (padrao) ou uma versao publicada (ex.: v42) para voltar atras
    image: ${DOCKERHUB_USUARIO:?Defina DOCKERHUB_USUARIO no arquivo .env}/progest-api:${VERSAO:-latest}
    build: ./backend/Backend_api
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
      # Administrador do ERP: criado/atualizado com esta senha a cada inicio
      ADMIN_EMAIL: ${ADMIN_EMAIL:-amaralalambrados109@gmail.com}
      ADMIN_NOME: ${ADMIN_NOME:-Administrador}
      ADMIN_SENHA: ${ADMIN_SENHA:?Defina ADMIN_SENHA no arquivo .env}
      # Funcionario do ERP (opcional): so ve Producao e Entregas
      FUNCIONARIO_EMAIL: ${FUNCIONARIO_EMAIL:-}
      FUNCIONARIO_NOME: ${FUNCIONARIO_NOME:-Funcionário}
      FUNCIONARIO_SENHA: ${FUNCIONARIO_SENHA:-}
      # Dados ficticios para apresentacao (opcional; roda uma vez so por banco)
      DEMO_DADOS: ${DEMO_DADOS:-false}
      DEMO_SENHA: ${DEMO_SENHA:-}
      # Recuperacao de senha do cliente: endereco do site (vai no link) e SMTP (opcional;
      # sem MAIL_HOST o e-mail nao sai, mas o ERP gera o link para mandar pelo WhatsApp)
      SITE_URL: ${SITE_URL:-}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      # Limita a memoria do Java para caber em uma instancia pequena
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx512m
    volumes:
      - progest-data:/app/data
    # Sem "ports": o backend so e acessivel pelo Nginx

  web:
    image: ${DOCKERHUB_USUARIO:?Defina DOCKERHUB_USUARIO no arquivo .env}/progest-frontend:${VERSAO:-latest}
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  # Arquivo do banco H2. Sobrevive a rebuilds e reinicios.
  # NAO rode "docker compose down -v": o -v apaga o banco.
  progest-data:
