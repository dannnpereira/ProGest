# Depois de cada merge na main, atualiza o fork que publica os sites na Vercel
# (liviaghirardi/ProGest). Assim o site e o ERP entram no ar em ~1 minuto,
# sem esperar o agendamento do fork (que o GitHub costuma atrasar por horas).
#
# Precisa do secret FORK_SYNC_TOKEN neste repositório (Settings > Secrets and
# variables > Actions): token "fine-grained" da dona do fork com acesso só ao
# repositório liviaghirardi/ProGest e permissão "Contents: Read and write".
# Sem o secret, o workflow só avisa e não falha.
name: Sincronizar fork da Vercel

on:
  push:
    branches: [main]
  workflow_dispatch: # botão "Run workflow" para sincronizar na hora

permissions: {} # o GITHUB_TOKEN deste repositório não é usado

concurrency:
  group: sincronizar-fork-vercel
  cancel-in-progress: false

jobs:
  sincronizar:
    # Este arquivo também chega ao fork quando ele sincroniza; lá não deve rodar
    if: github.repository == 'dannnpereira/ProGest'
    runs-on: ubuntu-latest
    env:
      FORK: liviaghirardi/ProGest
      GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
    steps:
      - name: Atualizar a main do fork
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::Secret FORK_SYNC_TOKEN não configurado: o fork $FORK não foi sincronizado."
            exit 0
          fi
          gh api -X POST "repos/$FORK/merge-upstream" -f branch=main \
            --jq '"Resultado: \(.merge_type) - \(.message)"'
