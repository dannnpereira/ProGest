name: Publicar imagens no Docker Hub

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Entrar no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publicar frontend
        uses: docker/build-push-action@v6
        with:
          context: ./progest
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/tetris-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/tetris-frontend:v${{ github.run_number }}
            ${{ secrets.DOCKERHUB_USERNAME }}/tetris-frontend:${{ github.sha }}

      - name: Publicar API
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/tetris-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/tetris-api:v${{ github.run_number }}
            ${{ secrets.DOCKERHUB_USERNAME }}/tetris-api:${{ github.sha }}