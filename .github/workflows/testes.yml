# Roda os testes automatizados em cada pull request e em cada merge na main:
#   API (Spring Boot, ./mvnw test), site do cliente (progest/) e painel ProGest (erp/).
# Os testes do front rodam no Node com jsdom (não precisam de navegador).
name: Testes

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API (Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/Backend_api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Testes da API
        run: |
          chmod +x mvnw
          ./mvnw -B test

  front:
    name: ${{ matrix.nome }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - nome: Site do cliente
            pasta: progest
          - nome: Painel ProGest (ERP)
            pasta: erp
    defaults:
      run:
        working-directory: ${{ matrix.pasta }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ${{ matrix.pasta }}/package-lock.json
      - run: npm ci
      - name: Testes
        run: npx ng test --watch=false
      - name: Build de produção
        run: npx ng build
