# Blueprint do Render: cria o backend com tudo configurado.
# No Render: New -> Blueprint -> escolha este repositório. Ele pede só a ADMIN_SENHA.
# Detalhes e problemas comuns: deploy/RENDER.md
services:
  - type: web
    name: progest-backend
    runtime: docker
    plan: free
    region: virginia
    branch: main
    # O Dockerfile do backend fica nesta pasta (caminhos a partir da raiz do repositório)
    dockerfilePath: ./backend/Backend_api/Dockerfile
    dockerContext: ./backend/Backend_api
    healthCheckPath: /api/saude
    autoDeploy: true
    # Só faz novo deploy quando algo do backend mudar (não a cada mudança nos sites)
    buildFilter:
      paths:
        - backend/Backend_api/**
    envVars:
      - key: ADMIN_EMAIL
        value: amaralalambrados109@gmail.com
      # Senha do administrador do ERP: o Render pergunta na hora de criar.
      # Nunca coloque a senha neste arquivo (o repositório é público).
      - key: ADMIN_SENHA
        sync: false
      # Funcionário do ERP (só vê Produção e Entregas): e-mail e senha definidos no painel do Render
      - key: FUNCIONARIO_EMAIL
        sync: false
      - key: FUNCIONARIO_SENHA
        sync: false
      # Banco Postgres do Supabase (passo a passo: deploy/SUPABASE.md).
      # Sem eles o banco fica dentro do servidor e SOME a cada reinício/deploy.
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
