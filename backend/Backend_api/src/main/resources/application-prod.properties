# Perfil de producao. O Dockerfile ja liga este perfil (SPRING_PROFILES_ACTIVE=prod),
# entao vale no Render, na EC2 e em qualquer servidor que rode a imagem Docker.
# Sobrescreve apenas o que muda em relacao ao application.properties.

# Banco de dados.
# - Com DB_URL (recomendado): Postgres do Supabase. Os dados ficam fora do servidor,
#   entao nada se perde quando o Render reinicia ou faz deploy. Passo a passo: deploy/SUPABASE.md
#   Ex.: DB_URL=jdbc:postgresql://aws-0-sa-east-1.pooler.supabase.com:5432/postgres?sslmode=require
#        DB_USER=postgres.<id-do-projeto>   DB_PASSWORD=<senha do banco no Supabase>
# - Sem DB_URL: H2 em arquivo dentro do container (pasta /app/data). So serve com disco
#   permanente (docker-compose da EC2). No Render gratis o arquivo SOME a cada reinicio.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/progest}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

# Poucas conexoes: o plano gratis do Supabase tem limite e o backend e pequeno
spring.datasource.hikari.maximum-pool-size=${DB_POOL:5}
spring.datasource.hikari.minimum-idle=1

# NUNCA deixar o console do H2 exposto na internet (permite executar comandos no servidor)
spring.h2.console.enabled=false

spring.jpa.show-sql=false
spring.jpa.open-in-view=false
