# Perfil de producao. O Dockerfile ja liga este perfil (SPRING_PROFILES_ACTIVE=prod),
# entao vale no Render, na EC2 e em qualquer servidor que rode a imagem Docker.
# Sobrescreve apenas o que muda em relacao ao application.properties.

# Banco: H2 em arquivo (pasta /app/data dentro do container).
# Para migrar para outro banco (ex.: Postgres), basta trocar estas variaveis.
# DB_PASSWORD e opcional: vale a do primeiro inicio do banco (depois nao troque).
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/progest}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

# NUNCA deixar o console do H2 exposto na internet (permite executar comandos no servidor)
spring.h2.console.enabled=false

spring.jpa.show-sql=false
spring.jpa.open-in-view=false
