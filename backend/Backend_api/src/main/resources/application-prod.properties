# Perfil de producao (ativado com SPRING_PROFILES_ACTIVE=prod no docker-compose.yml).
# Sobrescreve apenas o que muda em relacao ao application.properties.

# Banco: H2 em arquivo dentro do volume Docker (/app/data).
# Para migrar para outro banco (ex.: RDS Postgres), basta trocar estas variaveis.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/progest}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD}

# NUNCA deixar o console do H2 exposto na internet (permite executar comandos no servidor)
spring.h2.console.enabled=false

# Em producao a senha do primeiro usuario do ERP precisa vir do .env (sem valor padrao)
progest.admin.senha=${ADMIN_SENHA:}

spring.jpa.show-sql=false
spring.jpa.open-in-view=false
