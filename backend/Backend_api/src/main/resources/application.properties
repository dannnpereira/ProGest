# Porta: Render, Railway e afins informam a porta na variavel PORT.
# Sem ela (no computador e no docker-compose), usa 8081.
server.port=${PORT:8081}

# Configuracoes so desta maquina (ex.: senha do ERP). O arquivo local.properties
# fica em src/main/resources, NAO vai para o git e e opcional.
spring.config.import=optional:classpath:local.properties

# Banco de dados H2 em arquivo (os dados ficam salvos em ./data/progest.mv.db
# e sobrevivem ao reinicio da aplicacao)
spring.datasource.url=jdbc:h2:file:./data/progest;AUTO_SERVER=TRUE
# O driver (H2 ou Postgres) e escolhido pela propria URL
spring.datasource.username=sa
spring.datasource.password=

# Inicializacao do script SQL
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Console H2 (so no computador; o perfil prod desliga)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.web.error.include-message=always

# Usuario administrador do ERP. Ao iniciar, o backend garante que ele exista com
# a senha de ADMIN_SENHA. A senha NUNCA fica no codigo (o repositorio e publico):
# no servidor vem da variavel ADMIN_SENHA; no computador, do local.properties.
progest.admin.email=${ADMIN_EMAIL:amaralalambrados109@gmail.com}
progest.admin.nome=${ADMIN_NOME:Administrador}
progest.admin.senha=${ADMIN_SENHA:}

# Funcionario do ERP: so ve Producao e Entregas. Opcional (sem e-mail, nao e criado).
# Mesma regra do administrador: e-mail e senha so por variavel de ambiente / local.properties.
progest.funcionario.email=${FUNCIONARIO_EMAIL:}
progest.funcionario.nome=${FUNCIONARIO_NOME:Funcionário}
progest.funcionario.senha=${FUNCIONARIO_SENHA:}

# Dados ficticios para apresentacao (clientes e pedidos em todas as etapas).
# Desligado por padrao; roda uma vez so por banco. Ver config/DadosDemo.java.
# DEMO_SENHA (opcional, minimo 8): senha para entrar no site com os clientes de exemplo.
progest.demo.ativo=${DEMO_DADOS:false}
progest.demo.senha=${DEMO_SENHA:}

# Sites que podem chamar a API direto de outro dominio (CORS), separados por virgula.
# Ex.: CORS_ORIGENS=https://progest.vercel.app,https://*.vercel.app
# Vazio = so o proprio dominio (com rewrite da Vercel ou Nginx nao precisa).
progest.cors.origens=${CORS_ORIGENS:}
