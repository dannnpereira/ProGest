server.port=8081

# Banco de dados H2 em arquivo (os dados ficam salvos em ./data/progest.mv.db
# e sobrevivem ao reinicio da aplicacao)
spring.datasource.url=jdbc:h2:file:./data/progest;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Inicializacao do script SQL
spring.sql.init.mode=always

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Console H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.web.error.include-message=always

# Primeiro usuario do ERP, criado quando a tabela usuarios_erp esta vazia.
# Os valores abaixo sao so para rodar no computador; no servidor eles vem do .env.
progest.admin.email=${ADMIN_EMAIL:admin@amaral.com.br}
progest.admin.nome=${ADMIN_NOME:Administrador}
progest.admin.senha=${ADMIN_SENHA:amaral2026}
