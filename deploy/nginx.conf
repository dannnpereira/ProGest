# Limite de tentativas no login/cadastro: 10 por minuto por IP (protege contra
# quem tenta adivinhar senhas). Passou disso, o Nginx responde 429.
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    client_max_body_size 5m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Cabecalhos de seguranca basicos
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Login e cadastro: com limite de tentativas
    location ^~ /api/auth/ {
        limit_req zone=auth burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/conf.d/proxy-backend.inc;
    }

    # Demais rotas da API: encaminha para o backend (a porta 8081 nao fica exposta)
    location ^~ /api/ {
        include /etc/nginx/conf.d/proxy-backend.inc;
    }

    # Painel de gestao (ERP) - nao deve aparecer no Google.
    # (um add_header aqui anula os do server, por isso eles se repetem)
    location /erp/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /erp/index.html;
    }

    location = /erp {
        return 301 /erp/;
    }

    # Site do cliente (SPA: rotas como /login e /rastrear caem no index.html)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Arquivos com hash no nome podem ficar em cache por bastante tempo
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpe?g|webp|ico)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }
}
